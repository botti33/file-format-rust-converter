[package]
name = "anyconvert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for AnyConvert"

[[bin]]
name = "anyconvert"
path = "src/main.rs"

[dependencies]
anyconvert-core = { path = "../core" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
