[package]
name = "anyconvert-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GUI for AnyConvert"

[[bin]]
name = "anyconvert-gui"
path = "src/main.rs"

[dependencies]
anyconvert-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.18"
